name: Claude Review (reusable)

# Shared implementation, called by claude-review.yml in each participating
# repo via `workflow_call` + `secrets: inherit`. Do not call this workflow
# directly from outside another workflow's `uses:` — it has no `on:` trigger
# of its own besides workflow_call.
#
# What this does, in order:
#   1. Checks out the calling repo's PR head.
#   2. Runs Claude Review on the Pro/Max subscription (CLAUDE_CODE_OAUTH_TOKEN)
#      with the thermo-nuclear-code-quality-review prompt inlined below.
#
# The review posts only a COMMENT-type PR review — never APPROVE or REQUEST_
# CHANGES. Merge approval stays a human call; branch protection on each
# calling repo is the structural backstop, not this workflow.
#
# If the subscription call fails (missing/revoked token, rate limit, quota
# exhaustion), this job fails and shows red on the PR check — on purpose.
# An earlier version of this workflow silently fell back to metered
# API-key billing plus a bespoke Slack DM alert when the subscription path
# failed; that fallback (a) required a dedicated GitHub App + org secrets
# to mint a token just to sparse-checkout one shared prompt file out of
# this repo, and (b) was the actual cause of every real-world failure this
# workflow hit in its first two days — including "green" runs that had
# silently failed to load the skill and done an ad hoc review instead. A
# visible red check with a clear log is simpler and more honest than a
# silent metered-billing fallback; if per-repo cost control turns out to
# matter enough to bring API fallback back, do it deliberately and test it
# for real (grep the run log, don't trust the exit code) rather than
# re-adding the same shape of complexity.
#
# The prompt text below is sourced from this repo's
# .claude/skills/thermo-nuclear-code-quality-review/SKILL.md — keep that
# file's "Core Prompt" + "Non-Negotiable Additional Standards" section in
# sync if you edit either copy. SKILL.md stays in the repo as the
# documented/readable source; this file is what actually runs.
#
#   3. Runs a SEPARATE job, `test-review`, implementing
#      .claude/skills/automated-test-review/SKILL.md. Unlike `review` above,
#      this job is a real merge gate: it fetches the OpenProject work
#      package linked in the PR, judges the diff's tests against that
#      story's outputs and the org's E2E-first testing ground rules, writes
#      a verdict artifact, and fails the job (red check) if tests are
#      missing or inadequate. Keep test-review's prompt in sync with
#      .claude/skills/automated-test-review/SKILL.md the same way.
#
# `test-review` talks to OpenProject via OpenProject's own built-in MCP
# server (Enterprise add-on, enabled on projects.liftofflearning.tech at
# Administration -> Artificial Intelligence -> Model Context Protocol) —
# NOT the earlier third-party npm package, and NOT a self-run copy of
# DDeluca06/openproject-mcp. It's a remote HTTP MCP endpoint at
# <OPENPROJECT_URL>/mcp, so unlike the GitHub-side tools there's nothing to
# check out or pin to a commit — one fewer moving part and one fewer
# secret (OPENPROJECT_MCP_REPO_TOKEN is gone).
#
# Tool names CONFIRMED live 2026-09-22 (not a guess): connected to this same
# instance's Enterprise MCP endpoint via the claude.ai OpenProject connector
# (OAuth path) in an interactive session and inspected real responses —
# search_work_packages({page:1}) returned {items:[...40 of 441...], total}
# where each item has a real `description: {format:"markdown", raw: "..."}`
# field, exactly what automated-test-review needs to read acceptance
# criteria. TEST_REVIEW_ALLOWED_TOOLS below names those confirmed tools
# directly instead of a server-level wildcard.
#
# CAUTION — one thing that OAuth-based check above does NOT verify: this
# job authenticates as a personal API token (Bearer), not OAuth — a
# different auth path than the one just tested. Confirm with
# show_full_output: true on a throwaway PR that a bearer personal API token
# actually authenticates against <OPENPROJECT_URL>/mcp before trusting a
# green run here, the same discipline that caught the two real
# GitHub-tool-name bugs below. If it needs Basic auth instead (like the
# classic APIv3) or doesn't accept personal API tokens at all (requiring
# the OAuth-application path under Administration -> Authentication ->
# OAuth applications instead), the "Write OpenProject MCP config" step
# needs updating accordingly.
#
# Secrets expected from the caller via `secrets: inherit`:
#   CLAUDE_CODE_OAUTH_TOKEN — subscription auth, the only auth path.
#   OPENPROJECT_URL         — base URL of the OpenProject instance; the MCP
#                              endpoint is this plus `/mcp`. Org-wide.
#   OPENPROJECT_API_KEY     — personal API token from
#                              <OPENPROJECT_URL>/my/access_token, sent as a
#                              bearer token to the MCP endpoint (see CAUTION
#                              above). Org-wide; use a dedicated CI/bot
#                              OpenProject identity with read-only access
#                              rather than a real person's token.
#
# CLAUDE_ALLOWED_TOOLS below lists the actual MCP tool names exposed by the
# GitHub MCP server that anthropics/claude-code-action@v1 bundles internally
# — confirmed live on 2026-09-18 by running with show_full_output: true
# against a throwaway test PR. An earlier version of this file guessed names
# like mcp__github__pull_request_read / mcp__github__pull_request_review_write,
# which don't exist on this server; every real run silently failed every
# tool call ("Claude requested permissions to use mcp__github__get_pull_request,
# but you haven't granted it yet"), spent real subscription usage, and still
# exited success with no review ever posted. If you bump claude-code-action's
# pinned version, re-verify these names the same way before trusting a green
# check — don't just guess from the tool name shape.

on:
  workflow_call: {}

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # claude-code-action probes for a GitHub OIDC token as part of its
      # provider-auth discovery even when using claude_code_oauth_token
      # (not workload identity federation) -- observed failing with
      # "Could not fetch an OIDC token" on every live run without this
      # permission. Granting it doesn't broaden repo access, just lets the
      # job request an OIDC token if the action asks for one.
      id-token: write
    env:
      CLAUDE_REVIEW_PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        Perform a deep code quality audit of this PR's diff versus its base
        branch, focused on implementation quality, maintainability,
        abstraction quality, and codebase health. Rethink how to structure
        the changes to meaningfully improve code quality without impacting
        behavior. Work to improve abstractions and modularity, reduce
        spaghetti code, and improve succinctness and legibility. Be
        ambitious: if there is a clear path to a dramatically simpler
        restructuring ("code judo" — a reorganization that uses the
        existing architecture more effectively and deletes whole branches,
        helpers, or layers rather than just rearranging them), push hard
        for it rather than settling for local cleanup. Be extremely
        thorough and rigorous. Measure twice, cut once.

        Apply these standards:
        - Flag a file crossing from under 1000 lines to over 1000 lines
          without a strong reason; prefer decomposition first.
        - Flag ad-hoc conditionals, scattered special cases, or one-off
          branches bolted onto existing flows; prefer a dedicated
          abstraction, helper, or module instead.
        - Bias toward the cleaner design over rubber-stamping "it works";
          prefer simplifications that remove moving pieces over refactors
          that just spread the same complexity around.
        - Prefer direct, boring, maintainable code over hacky or magical
          mechanisms; flag thin/identity wrappers that add indirection
          without clarity.
        - Push on type and boundary cleanliness: question unnecessary
          optionality, `unknown`/`any`, or cast-heavy code; prefer explicit
          typed models over ad-hoc shapes.
        - Flag feature logic leaking into shared/canonical paths; prefer
          existing canonical helpers over bespoke one-offs.
        - Flag unnecessary sequential orchestration or non-atomic updates
          when a more parallel or atomic structure is clearly better.

        Prioritize findings in this order: structural regressions, missed
        dramatic-simplification opportunities, spaghetti/branching growth,
        boundary/type problems, file-size/decomposition, modularity, then
        legibility. Prefer a small number of high-conviction comments over
        a long list of cosmetic nits. Do not soften major maintainability
        issues into mild suggestions, but stay direct rather than rude.

        Post your findings as a single PR review with event type COMMENT.
        Do NOT approve this PR and do NOT request changes as a formal review
        state — this review is advisory only. A human reviewer is the merge
        gate, not you.
      CLAUDE_ALLOWED_TOOLS: >-
        Read,Grep,Glob,
        mcp__github__get_pull_request,
        mcp__github__get_pull_request_diff,
        mcp__github__get_pull_request_files,
        mcp__github__create_and_submit_pull_request_review
      CLAUDE_DISALLOWED_TOOLS: >-
        mcp__github__merge_pull_request,
        mcp__github__update_pull_request,
        mcp__github__create_or_update_file,
        mcp__github__push_files,
        mcp__github__delete_file
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # CLAUDE_ALLOWED_TOOLS/CLAUDE_DISALLOWED_TOOLS above are YAML folded
      # scalars (`>-`): each line break folds to a single space, so the
      # comma-then-newline in the source becomes ", " in the actual string
      # (e.g. "Read,Grep,Glob, mcp__github__get_pull_request, ..."). That
      # leading space on every entry after the first is a real bug, not
      # cosmetic — found live via test-review below (see that job's comment)
      # where it caused every allowlisted MCP tool call to be silently
      # permission-denied because the allowlist entries didn't literally
      # match the requested tool names. Stripping all whitespace here before
      # it reaches claude_args fixes both jobs.
      - name: Normalize tool allowlists
        run: |
          echo "CLAUDE_ALLOWED_TOOLS_CLEAN=$(echo "$CLAUDE_ALLOWED_TOOLS" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "CLAUDE_DISALLOWED_TOOLS_CLEAN=$(echo "$CLAUDE_DISALLOWED_TOOLS" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Claude Review (subscription)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.CLAUDE_REVIEW_PROMPT }}
          claude_args: |
            --allowedTools ${{ env.CLAUDE_ALLOWED_TOOLS_CLEAN }}
            --disallowedTools ${{ env.CLAUDE_DISALLOWED_TOOLS_CLEAN }}

  # Separate job from `review` above on purpose: `review` (thermo-nuclear
  # code quality) stays advisory/COMMENT-only per 01-design.md's hard-learned
  # decision. `test-review` is a deliberate exception to that decision,
  # requested to make "no adequate tests" an actual red, merge-blocking
  # check rather than a comment a human can skim past. See the CAUTION note
  # in this file's header before wiring OPENPROJECT_API_KEY into any repo.
  test-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # CONFIRMED (live run 35768453106): invoking this as a *Skill* tool
      # call doesn't work in CI the way it does for a human editing this
      # repo. Skill discovery only scans .claude/skills/ inside the checked-
      # out working directory, which for a workflow_call job is the
      # *calling* repo (e.g. claude-review-ci-test), not this repo
      # (LaunchPadPhilly/.github) where automated-test-review/SKILL.md
      # actually lives. A prior attempt to fix that by cross-repo checking
      # out this repo's skill folder failed too: LaunchPadPhilly/.github is
      # private, and the calling repo's default GITHUB_TOKEN has no
      # cross-repo read access to it (no PAT/App token exists for this,
      # unlike whatever mechanism was already solved for the `review` job
      # above). Both attempts left Claude correctly refusing to fabricate a
      # verdict rather than guess the rules — the right failure mode, but it
      # means the skill's real judgment logic had never actually run before
      # this fix.
      #
      # Fix: match the `review` job's own established pattern exactly
      # (CLAUDE_REVIEW_PROMPT above) — inline the ground rules directly into
      # the prompt instead of relying on runtime Skill discovery. The
      # .claude/skills/automated-test-review/SKILL.md file stays as the
      # readable, authoritative source; keep both in sync if you edit the
      # standards, same discipline the review job's comment already asks for.
      TEST_REVIEW_PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        Judge whether this PR's automated tests are adequate proof that the
        linked OpenProject user story actually works — not whether *some*
        test exists. A PR can have 100% green CI and still fail this review.
        This is a merge-blocking check: if your verdict is
        `tests_adequate: false`, the job step below fails the job on
        purpose.

        Step 1 — find the user story:
        1. Read the PR title/description and commit messages for an
           OpenProject work package reference (e.g. OP#1234, op:1234, a
           work-package URL).
        2. If none is found: fail immediately. tests_adequate: false,
           reasons: ["no OpenProject work package linked to this PR"]. Do
           not attempt to infer intent from the diff alone.
        3. If found, fetch the work package with
           mcp__openproject__search_work_packages (filter by id). Its
           description.raw field is markdown — read it, and pull any
           comments via mcp__openproject__list_work_package_comments if
           acceptance criteria were refined there instead of in the
           description, for the concrete, observable outputs the story
           commits to (user-visible behavior, not implementation detail).
        4. If the work package has no discernible acceptance criteria /
           expected outputs (just a title), fail: reasons: ["OP#<id> has no
           acceptance criteria to test against"]. Do not guess what "done"
           means.

        Step 2 — check what the diff actually added: read the PR diff via
        mcp__github__get_pull_request_diff / get_pull_request_files. For
        each output the user story commits to, find the test (if any) that
        exercises it, then judge it against the ground rules below. A
        missing test for a committed output is treated the same as an
        inadequate one.

        Ground rules for "proper automated tests" — these are the bar, not
        suggestions; cite the specific rule a test fails when flagging it:
        1. E2E-first. For any feature with real complexity, an end-to-end
           test exercising the real path (not mocks) is the primary
           evidence, not a supplement to unit tests. Don't accept a
           mocked-unit-test suite in place of an E2E test when the real
           path (real DB, real API, real service boundary) could have been
           exercised instead.
        2. E2E tests must have variance, not the easy path. A test that
           only proves the happy path with the simplest possible input does
           not meet the bar. Look for realistic complexity: multiple
           records, edge-of-range values, a second actor/tenant, a state
           transition, something that would actually catch a subtly wrong
           implementation.
        3. E2E tests must produce a verifiable, repeatable artifact.
           Artifact: something a human or CI step can inspect after the run
           independent of the pass/fail signal — a diffable state snapshot,
           a structured JSON report, or a trace/log uploaded by CI. "The
           assertions passed" is not an artifact. Repeatable: deterministic
           given the same starting state, doesn't depend on execution order
           or leftover state, safe to re-run without manual cleanup. A test
           missing either property fails this rule even if well-targeted.
        4. No tautological / change-detector tests. A test that can only
           fail if someone deliberately breaks it, or that fails on any
           implementation change regardless of whether behavior changed,
           does not count as coverage. Flag and disregard these even if
           present.
        5. Regression tests need genuine new coverage, not a pinned repro.
           Check whether a regression test widens coverage of the actual
           class of input/state that was untested, not just the exact
           reported input/code path. If it's just the bug report turned
           into an assertion, treat the underlying gap as still open.
        6. Combine trivial tests. Several near-identical trivial-assertion
           tests that could be one parameterized/table test are a smell —
           call it out but don't fail the PR for this alone unless it's
           masking rules 1–5 (e.g. ten trivial unit tests standing in for
           the one E2E test actually needed).

        Step 3 — verdict: write a JSON verdict file to
        .test-review-verdict.json at the repo root (the calling workflow
        uploads this as a build artifact and greps it for the pass/fail
        decision — this file IS the artifact for this review, get the
        schema right):
        {
          "work_package_id": "1234",
          "tests_adequate": false,
          "outputs_checked": [
            {"output": "user can export their timesheet as CSV", "test": "none found", "verdict": "missing"},
            {"output": "export excludes voided entries", "test": "spec/timesheet_export_spec.rb:44", "verdict": "adequate"}
          ],
          "reasons": [
            "no test exercises the CSV export path end-to-end; only a mocked unit test on the formatter exists (rule 1)",
            "the existing formatter test always uses a single well-formed row — no variance (rule 2)"
          ]
        }
        tests_adequate is false if any committed output has a missing or
        inadequate test. Then post a single PR review, event type COMMENT
        (this job step failing is the actual gate, not a formal GitHub
        review state), summarizing the verdict file in human-readable form,
        quoting the specific rule each gap violates. Do NOT approve or
        request changes as a formal review state.
      # openproject tool names below are confirmed real (see this file's
      # header) — server key "openproject" is our own choice, matching the
      # key used in the "Write OpenProject MCP config" step. search_work_packages
      # supports an `id` filter, used to fetch the linked work package;
      # list_work_package_comments covers acceptance criteria discussed in
      # comments rather than the description. Still unverified: whether the
      # CI bearer-token auth path (vs. the OAuth path these names were
      # confirmed against) can reach these same tools — see CAUTION above.
      TEST_REVIEW_ALLOWED_TOOLS: >-
        Read,Grep,Glob,Write,
        mcp__github__get_pull_request,
        mcp__github__get_pull_request_diff,
        mcp__github__get_pull_request_files,
        mcp__github__create_and_submit_pull_request_review,
        mcp__openproject__search_work_packages,
        mcp__openproject__list_work_package_comments
      TEST_REVIEW_DISALLOWED_TOOLS: >-
        mcp__github__merge_pull_request,
        mcp__github__update_pull_request,
        mcp__github__create_or_update_file,
        mcp__github__push_files,
        mcp__github__delete_file
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # OpenProject's own hosted MCP server — a remote HTTP endpoint, so
      # unlike the earlier design there's nothing to check out or pin here.
      #
      # CONFIRMED (live run 35767166118, LaunchPadPhilly/claude-review-ci-test
      # PR #2): the originally-planned `--mcp-config <file path>` design does
      # NOT work with anthropics/claude-code-action. The action always
      # auto-injects its own built-in MCP servers (github,
      # github_inline_comment, ...) as an *inline JSON* `--mcp-config` value.
      # Its base-action arg parser (base-action/src/parse-sdk-options.ts,
      # mergeMcpConfigs) merges multiple `--mcp-config` occurrences by
      # Object.assign-ing every inline-JSON value's `mcpServers`, but for a
      # *file path* value it can't read the file at parse time — so whenever
      # any inline JSON config is also present (which it always is, from the
      # action's own servers), the file path is silently dropped and only
      # the action's own servers survive. The init "system" event's
      # `mcp_servers` list confirmed this directly: only "github" and
      # "github_inline_comment" ever showed up as connected, never
      # "openproject" — with no error, just silence. This is why the first
      # two live runs reported no OpenProject connector at all.
      #
      # Fix: emit our server as inline JSON too (via $GITHUB_ENV, single
      # line, jq -c) so it merges via the same Object.assign path instead of
      # the broken file-path path. This does put the API key's value inside
      # a `claude_args` string that gets echoed to the step log, unlike the
      # file-path approach — but GitHub Actions' secret masking scans *all*
      # log output for any registered `secrets.*` value, not just the step
      # that reads it, so `secrets.OPENPROJECT_API_KEY` gets masked wherever
      # it appears job-wide, including nested in this JSON. Prefer that over
      # a "safer-looking" design that turned out not to work at all.
      #
      # Auth header UNVERIFIED — see the CAUTION block in this file's
      # header. Update this if OpenProject's MCP endpoint turns out to need
      # Basic auth (username "apikey", like the classic APIv3) instead of a
      # bearer token.
      - name: Write OpenProject MCP config
        env:
          OPENPROJECT_URL: ${{ secrets.OPENPROJECT_URL }}
          OPENPROJECT_API_KEY: ${{ secrets.OPENPROJECT_API_KEY }}
        run: |
          set -euo pipefail
          config=$(jq -nc \
            --arg url "${OPENPROJECT_URL%/}/mcp" \
            --arg auth "Bearer ${OPENPROJECT_API_KEY}" \
            '{mcpServers:{openproject:{type:"http",url:$url,headers:{Authorization:$auth}}}}')
          {
            echo "OPENPROJECT_MCP_CONFIG_JSON<<__OPENPROJECT_MCP_CONFIG_EOF__"
            echo "$config"
            echo "__OPENPROJECT_MCP_CONFIG_EOF__"
          } >> "$GITHUB_ENV"

      # See "Normalize tool allowlists" in the `review` job above for why
      # this step exists: TEST_REVIEW_ALLOWED_TOOLS/_DISALLOWED_TOOLS are
      # folded YAML scalars, so every entry after the first has a leading
      # space in the real string. CONFIRMED root cause of the first live
      # test-review run (LaunchPadPhilly/claude-review-ci-test PR #2,
      # run 35765864950) reporting "No OpenProject connector or credentials
      # are available" with permission_denials_count: 11 — exactly the
      # number of entries in the allowlist. The tool matcher does not trim
      # whitespace, so " mcp__openproject__search_work_packages" never
      # matched the requested "mcp__openproject__search_work_packages" and
      # every allowlisted MCP tool call was denied, not just OpenProject's.
      - name: Normalize tool allowlists
        run: |
          echo "TEST_REVIEW_ALLOWED_TOOLS_CLEAN=$(echo "$TEST_REVIEW_ALLOWED_TOOLS" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "TEST_REVIEW_DISALLOWED_TOOLS_CLEAN=$(echo "$TEST_REVIEW_DISALLOWED_TOOLS" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Claude Test Review (subscription)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.TEST_REVIEW_PROMPT }}
          # TEMPORARY debug flag, kept one more run to confirm the inline-JSON
          # --mcp-config fix (see "Write OpenProject MCP config" above)
          # actually gets "openproject" into the init event's mcp_servers
          # list. Remove once confirmed — see this file's header CAUTION.
          # User-approved 2026-09-22: putting the Bearer token inline in
          # claude_args (rather than a file path, which the action silently
          # drops) is acceptable, relying on GitHub Actions' secret masking
          # to redact `secrets.OPENPROJECT_API_KEY` wherever it appears in
          # job logs, including nested in this JSON string.
          show_full_output: true
          claude_args: |
            --mcp-config '${{ env.OPENPROJECT_MCP_CONFIG_JSON }}'
            --allowedTools ${{ env.TEST_REVIEW_ALLOWED_TOOLS_CLEAN }}
            --disallowedTools ${{ env.TEST_REVIEW_DISALLOWED_TOOLS_CLEAN }}

      - name: Upload test-review verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-review-verdict
          path: .test-review-verdict.json
          if-no-files-found: warn

      - name: Enforce test-adequacy verdict
        run: |
          set -euo pipefail
          if [ ! -f .test-review-verdict.json ]; then
            echo "::error::automated-test-review produced no verdict file — treating as failed (no evidence tests were checked)."
            exit 1
          fi
          adequate=$(jq -r '.tests_adequate' .test-review-verdict.json)
          echo "--- test-review verdict ---"
          jq . .test-review-verdict.json
          if [ "$adequate" != "true" ]; then
            echo "::error::tests_adequate=false — see the verdict artifact and the PR review comment for what's missing."
            exit 1
          fi
